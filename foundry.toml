# Stoxes.fun smart contracts — deployed on BNB Smart Chain (BSC, chain ID 56).
# Compiler settings match the source verified on BscScan; do not change them
# if you want to reproduce the deployed bytecode exactly.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"

[fmt]
line_length = 110

# BNB Chain RPC endpoints
[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

# BscScan source verification
[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56, url = "https://api.bscscan.com/api" }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97, url = "https://api-testnet.bscscan.com/api" }
